# =============================================================================
# Dependabot Configuration
# =============================================================================
#
# PROJECT ON HIATUS (July 2026): Dependabot VERSION-update PRs are disabled
# via `open-pull-requests-limit: 0`, because they were accumulating with no
# active maintainer to review and merge them.
#
# Dependabot SECURITY alerts and security-update PRs are controlled by the
# repository's security settings (not this file) and remain enabled.
#
# To resume normal version updates, restore this file from git history
# (any revision prior to July 2026 has the full schedule/group config).
#
# =============================================================================

version: 2
updates:
    # npm — version updates disabled (open-pull-requests-limit: 0)
    - package-ecosystem: 'npm'
      directory: '/'
      schedule:
          interval: 'monthly'
      open-pull-requests-limit: 0

    # GitHub Actions — version updates disabled (open-pull-requests-limit: 0)
    - package-ecosystem: 'github-actions'
      directory: '/'
      schedule:
          interval: 'monthly'
      open-pull-requests-limit: 0
